name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci
        working-directory: labs/app-1

      - run: npm audit --audit-level=high
        working-directory: labs/app-1

      - run: npm run build
        working-directory: labs/app-1